name: workstation-ci

# Tests and lint for workstation/ on Linux, Windows and macOS (GitHub-hosted runners: public repo).
# Default checks never pull images, download models or touch a GPU.
on:
  push:
    branches: [main]
    paths: ["workstation/**", "tests/**", "pyproject.toml", "toolboxes/gguf-vram-estimator.py",
            ".github/workflows/workstation-ci.yml"]
  pull_request:
    paths: ["workstation/**", "tests/**", "pyproject.toml", "toolboxes/gguf-vram-estimator.py",
            ".github/workflows/workstation-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12"]
        include:
          - os: ubuntu-latest
            python: "3.10"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install "pytest>=8" "ruff>=0.6"
      - run: python -m ruff check workstation tests
      - run: python -m pytest -q
